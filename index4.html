<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<link rel="stylesheet" href="indec4.css">

<div class="container">
    <div class="calculator">
        <div class="display">
            <input type="text" placeholder="8.3 + 1.7">
          </div>

        <div class="buttons">
            <button class="op">+</button>
            <button class="op">-</button>
            <button class="op">×</button>
            <button class="op">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="clear">C</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>

            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
        </div>
    </div>
</div>

</body>
</html>
